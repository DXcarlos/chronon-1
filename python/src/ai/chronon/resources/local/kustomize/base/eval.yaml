# Eval service deployment
# Provides the Chronon Eval API for feature evaluation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-hadoop-config
  namespace: chronon
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://minio:9000</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>minioadmin</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3a.aws.credentials.provider</name>
        <value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value>
      </property>
      <property>
        <name>fs.s3a.threads.keepalivetime</name>
        <value>60</value>
      </property>
      <property>
        <name>fs.s3a.threads.max</name>
        <value>64</value>
      </property>
      <property>
        <name>fs.s3a.connection.timeout</name>
        <value>200000</value>
      </property>
      <property>
        <name>fs.s3a.connection.establish.timeout</name>
        <value>5000</value>
      </property>
    </configuration>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval
  namespace: chronon
  labels:
    app: eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval
  template:
    metadata:
      labels:
        app: eval
    spec:
      initContainers:
        - name: wait-for-hub
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://hub:3903/ping; do
                echo "Waiting for Hub service..."
                sleep 2
              done
              echo "Hub is ready"
      containers:
        - name: eval
          image: chronon-spark-k8s:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              exec java \
                -Xms1g \
                -Xmx2g \
                --add-opens=java.base/java.lang=ALL-UNNAMED \
                --add-opens=java.base/java.lang.invoke=ALL-UNNAMED \
                --add-opens=java.base/java.lang.reflect=ALL-UNNAMED \
                --add-opens=java.base/java.io=ALL-UNNAMED \
                --add-opens=java.base/java.net=ALL-UNNAMED \
                --add-opens=java.base/java.nio=ALL-UNNAMED \
                --add-opens=java.base/java.util=ALL-UNNAMED \
                --add-opens=java.base/java.util.concurrent=ALL-UNNAMED \
                --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED \
                --add-opens=java.base/sun.nio.ch=ALL-UNNAMED \
                --add-opens=java.base/sun.nio.cs=ALL-UNNAMED \
                --add-opens=java.base/sun.security.action=ALL-UNNAMED \
                --add-opens=java.base/sun.util.calendar=ALL-UNNAMED \
                --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED \
                -Dserver.port=3904 \
                -Ddb.url=jdbc:postgresql://postgres:5432/execution-info \
                -Ddb.username="$DB_USERNAME" \
                -Ddb.password="$DB_PASSWORD" \
                -cp "/opt/chronon/eval.jar:/opt/spark/jars/*" \
                ai.chronon.orchestration.service.OrchestratorLauncher \
                run "ai.chronon.eval.service.K8sEvalVerticle"
          ports:
            - containerPort: 3904
              name: http
          env:
            # Database credentials (same as Hub - configs are stored in Hub's database)
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: hub-db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: hub-db-password
            # Iceberg warehouse configuration
            - name: CHRONON_EVAL_WAREHOUSE_PATH
              value: "s3a://warehouse/"
            - name: CHRONON_EVAL_WAREHOUSE_CATALOG
              value: "iceberg"
            - name: CHRONON_EVAL_CATALOG_TYPE
              value: "jdbc"
            # Iceberg JDBC catalog configuration
            - name: CHRONON_EVAL_ICEBERG_CATALOG_URI
              value: "jdbc:postgresql://postgres:5432/iceberg_catalog"
            - name: CHRONON_EVAL_ICEBERG_CATALOG_USER
              value: "chronon"
            - name: CHRONON_EVAL_ICEBERG_CATALOG_PASSWORD
              value: "chronon"
            # S3/MinIO configuration for warehouse access
            - name: AWS_ACCESS_KEY_ID
              value: "minioadmin"
            - name: AWS_SECRET_ACCESS_KEY
              value: "minioadmin"
            - name: AWS_ENDPOINT_URL
              value: "http://minio:9000"
            - name: AWS_REGION
              value: "us-east-1"
            # Spark configuration
            - name: SPARK_CONF_DIR
              value: "/opt/spark/conf"
            - name: HADOOP_CONF_DIR
              value: "/opt/hadoop/conf"
            # S3A configuration via Java system properties
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Dspark.sql.catalog.iceberg=org.apache.iceberg.spark.SparkCatalog
                -Dspark.sql.catalog.iceberg.type=jdbc
                -Dspark.sql.catalog.iceberg.uri=jdbc:postgresql://postgres:5432/iceberg_catalog
                -Dspark.sql.catalog.iceberg.jdbc.user=chronon
                -Dspark.sql.catalog.iceberg.jdbc.password=chronon
                -Dspark.sql.catalog.iceberg.warehouse=s3a://warehouse/
                -Dspark.sql.defaultCatalog=iceberg
                -Dspark.hadoop.fs.s3a.endpoint=http://minio:9000
                -Dspark.hadoop.fs.s3a.access.key=minioadmin
                -Dspark.hadoop.fs.s3a.secret.key=minioadmin
                -Dspark.hadoop.fs.s3a.path.style.access=true
                -Dspark.hadoop.fs.s3a.connection.ssl.enabled=false
                -Dspark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
                -Dspark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
                -Dspark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
                -Dspark.dynamicAllocation.enabled=false
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /ping
              port: 3904
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 3904
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: hadoop-config
              mountPath: /opt/hadoop/conf
      volumes:
        - name: hadoop-config
          configMap:
            name: eval-hadoop-config
---
apiVersion: v1
kind: Service
metadata:
  name: eval
  namespace: chronon
spec:
  selector:
    app: eval
  ports:
    - name: http
      port: 3904
      targetPort: 3904
---
# NodePort service for local access
apiVersion: v1
kind: Service
metadata:
  name: eval-nodeport
  namespace: chronon
spec:
  type: NodePort
  selector:
    app: eval
  ports:
    - name: http
      port: 3904
      targetPort: 3904
      nodePort: 30904
