# Spark RBAC configuration for Kubernetes
# Allows Spark driver pods to create/manage executor pods
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: chronon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: chronon
rules:
  # Pod management for executors
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch"]
  # Pod logs for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # ConfigMaps for Spark configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch", "update"]
  # Services for driver service (optional, for client mode)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch", "update"]
  # PersistentVolumeClaims for dynamic volumes
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  # Jobs for batch job submission (K8s Jobs with TTL)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: chronon
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: chronon
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
