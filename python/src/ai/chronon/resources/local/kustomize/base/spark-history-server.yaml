# Spark History Server with RocksDB backend for local development
# Connects to MinIO for event logs at s3a://chronon-spark-logs/
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-history-server-config
  namespace: chronon
data:
  spark-defaults.conf: |
    # Event log location (MinIO S3-compatible storage)
    spark.history.fs.logDirectory=s3a://chronon-spark-logs/event-logs

    # UI settings
    spark.history.ui.port=18080
    spark.history.retainedApplications=100

    # Log cleanup (7 day retention)
    spark.history.fs.cleaner.enabled=true
    spark.history.fs.cleaner.interval=1d
    spark.history.fs.cleaner.maxAge=7d

    # RocksDB backend to prevent OOM on large log volumes
    # This stores job index on disk instead of memory
    spark.history.store.path=/tmp/spark-history-store
    spark.history.store.maxDiskUsage=10g

    # S3A configuration for MinIO
    spark.hadoop.fs.s3a.endpoint=http://minio.chronon.svc.cluster.local:9000
    spark.hadoop.fs.s3a.access.key=minioadmin
    spark.hadoop.fs.s3a.secret.key=minioadmin
    spark.hadoop.fs.s3a.path.style.access=true
    spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.connection.ssl.enabled=false
    # S3A input stream settings for MinIO compatibility
    # Disable prefetching (Hadoop 3.3.4 compatible setting)
    spark.hadoop.fs.s3a.prefetch.enabled=false
    spark.hadoop.fs.s3a.experimental.input.fadvise=sequential
    # Disable readahead to force sequential reads
    spark.hadoop.fs.s3a.readahead.range=0
    # Connection settings
    spark.hadoop.fs.s3a.connection.maximum=50
    spark.hadoop.fs.s3a.connection.timeout=60000
    spark.hadoop.fs.s3a.connection.establish.timeout=60000
    spark.hadoop.fs.s3a.attempts.maximum=5

    # Update interval (how often to check for new logs)
    spark.history.fs.update.interval=10s

    # Workaround for S3A seek/range read issues with MinIO
    # Disables smart partial reads that hang on object stores
    spark.history.fs.inProgressOptimization.enabled=false
    # Forces full sequential replay rather than tail-chunk logic
    spark.history.fs.endEventReparseChunkSize=0
    # Single replay thread to avoid connection pool starvation
    spark.history.fs.numReplayThreads=1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spark-history-store
  namespace: chronon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: chronon
  labels:
    app: spark-history-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
    spec:
      containers:
        - name: spark-history-server
          image: chronon-spark-base:latest
          imagePullPolicy: Never
          command:
            - /opt/spark/bin/spark-class
            - org.apache.spark.deploy.history.HistoryServer
          ports:
            - containerPort: 18080
              name: http
          volumeMounts:
            - name: config
              mountPath: /opt/spark/conf/spark-defaults.conf
              subPath: spark-defaults.conf
            - name: store
              mountPath: /tmp/spark-history-store
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 18080
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: spark-history-server-config
        - name: store
          persistentVolumeClaim:
            claimName: spark-history-store
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server
  namespace: chronon
spec:
  selector:
    app: spark-history-server
  ports:
    - name: http
      port: 18080
      targetPort: 18080
---
# NodePort for local access (maps to hostPort 18080 in kind config)
apiVersion: v1
kind: Service
metadata:
  name: spark-history-server-nodeport
  namespace: chronon
spec:
  type: NodePort
  selector:
    app: spark-history-server
  ports:
    - name: http
      port: 18080
      targetPort: 18080
      nodePort: 30180
