apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chronon
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chronon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: chronon-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: HUB_API_URL
              value: "http://hub:8080"
