# Frontend service deployment
# Provides the Chronon web UI
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: chronon
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      initContainers:
        - name: wait-for-hub
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://hub:3903/ping; do
                echo "Waiting for Hub service..."
                sleep 2
              done
              echo "Hub is ready"
      containers:
        - name: frontend
          image: chronon-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgres://locker_user:locker_pass@postgres:5432/execution-info"
            - name: API_BASE_URL
              value: "http://hub:3903"
            - name: CLOUD_PROVIDER
              value: "k8s"
            - name: LOG_PROVIDER
              value: "loki"
            - name: LOKI_URL
              value: "http://loki.chronon.svc.cluster.local:3100"
            - name: STARROCKS_HOST
              value: "starrocks.chronon.svc.cluster.local:9030"
            - name: EVAL_URL
              value: "http://eval:3904"
            - name: FETCHER_BASE_URL
              value: "http://fetcher:9200"
            - name: PROMETHEUS_QUERY_ENDPOINT
              value: "http://prometheus:9090"
            - name: PROMETHEUS_NAMESPACE
              value: "chronon"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chronon
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
# NodePort service for local access
apiVersion: v1
kind: Service
metadata:
  name: frontend-nodeport
  namespace: chronon
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300
